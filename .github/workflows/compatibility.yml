name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22.12.0"
            astro: "6.0.0"
          - node: "22.12.0"
            astro: "7.0.0"
          - node: "22"
            astro: "6.4.8"
          - node: "22"
            astro: "7.4.5"
          - node: "24"
            astro: "6.0.0"
          - node: "24.0.0"
            astro: "7.0.0"
          - node: "24"
            astro: "7.4.5"
          - node: "26"
            astro: "6.0.0"
          - node: "26"
            astro: "7.4.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build && npm run format:check
      - run: npm pack --ignore-scripts --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/*.test.mjs
      - run: npm run test:compatibility -- ./astro-buffer-0.1.0.tgz
        env:
          ASTRO_VERSION: ${{ matrix.astro }}
